name: rankwell

services:
  db_main:
    image: postgres:16-alpine
    container_name: rankwell_db_main
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rankwell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rankwell}
      POSTGRES_DB: ${POSTGRES_DB:-rankwell}
    ports:
      - "5432:5432"
    volumes:
      - db_main_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-rankwell} -d ${POSTGRES_DB:-rankwell}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  db_shard_1:
    image: postgres:16-alpine
    container_name: rankwell_db_shard_1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rankwell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rankwell}
      POSTGRES_DB: ${POSTGRES_DB:-rankwell}
    ports:
      - "5433:5432"
    volumes:
      - db_shard_1_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-rankwell} -d ${POSTGRES_DB:-rankwell}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  db_shard_2:
    image: postgres:16-alpine
    container_name: rankwell_db_shard_2
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rankwell}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rankwell}
      POSTGRES_DB: ${POSTGRES_DB:-rankwell}
    ports:
      - "5434:5432"
    volumes:
      - db_shard_2_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-rankwell} -d ${POSTGRES_DB:-rankwell}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_main_data:
  db_shard_1_data:
  db_shard_2_data:
