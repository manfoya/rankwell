[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rankwell"
version = "0.1.0"
description = "Moteur de recherche : crawler, index inversé, PageRank et interface web."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "RankWell" }]
dependencies = [
    "beautifulsoup4>=4.12",
    "flask>=3.0",
    "jinja2>=3.1",
    "numpy>=1.26",
    "psycopg[binary,pool]>=3.1",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "scipy>=1.11",
]

[project.optional-dependencies]
dev = [
    "networkx>=3.2",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
